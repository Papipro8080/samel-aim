name: dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: bajar binario
        run: curl -fL -o freefireth "https://github.com/Papipro8080/samel-aim/releases/download/v1/freefireth"
      - name: dumper
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          curl -fL -o i2c.zip "https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net7-v6.7.46.zip"
          unzip -o i2c.zip -d i2c
          cd i2c
          set +e
          CMD="dotnet Il2CppDumper.dll $GITHUB_WORKSPACE/freefireth $GITHUB_WORKSPACE/global-metadata.dat $GITHUB_WORKSPACE/dump"
          printf '\n\n\n\n' | timeout 300 script -qec "$CMD" /dev/null > out.txt 2>&1
          cd "$GITHUB_WORKSPACE"
          mkdir -p dump
          cp "$(find "$GITHUB_WORKSPACE" -name dump.cs | head -1)" dump/dump.cs
          D="$GITHUB_WORKSPACE/dump/dump.cs"
          {
            echo "### 1. ArenaPlayerManager"
            sed -n '393178,393300p' "$D"
            echo "### 2. metodos que devuelven listas de jugadores"
            grep -nE "GetAllPlayer|GetPlayers\(|GetPlayerList|GetAlivePlayer|GetEnemyPlayer" "$D" | head -30
            echo "### 3. Player.GetPlayer abstracto"
            sed -n '477800,477840p' "$D"
            echo "### 4. GetPlayer concreto"
            sed -n '483650,483700p' "$D"
            echo "### 5. CurrentGame"
            grep -n "CurrentGame" "$D" | head -20
            echo "### 6. m_ReplicationEntitis y GetRepEntity"
            grep -n "m_ReplicationEntitis\|GetRepEntity\|RegisterRepEntity" "$D" | head -20
            echo "### 7. clase con m_EntityDic"
            sed -n '450700,450830p' "$D"
            echo "### 8. GINHBFJPFBP"
            sed -n "$(grep -n 'class GINHBFJPFBP' "$D" | head -1 | cut -d: -f1),+70p" "$D"
            echo "### 9. EAimAssist"
            sed -n "$(grep -n 'class EAimAssist' "$D" | head -1 | cut -d: -f1),+70p" "$D"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: dump/