name: dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: bajar binario
        run: curl -fL -o freefireth "https://github.com/Papipro8080/samel-aim/releases/download/v1/freefireth"
      - name: dumper
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          curl -fL -o i2c.zip "https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net7-v6.7.46.zip"
          unzip -o i2c.zip -d i2c
          cd i2c
          set +e
          CMD="dotnet Il2CppDumper.dll $GITHUB_WORKSPACE/freefireth $GITHUB_WORKSPACE/global-metadata.dat $GITHUB_WORKSPACE/dump"
          printf '\n\n\n\n' | timeout 300 script -qec "$CMD" /dev/null > out.txt 2>&1
          cd "$GITHUB_WORKSPACE"
          mkdir -p dump
          cp "$(find "$GITHUB_WORKSPACE" -name dump.cs | head -1)" dump/dump.cs
          D="$GITHUB_WORKSPACE/dump/dump.cs"
          {
            echo "### 1. COWGameBase"
            sed -n '417825,417950p' "$D"
            echo "### 2. MatchGame"
            sed -n '419061,419300p' "$D"
            echo "### 3. metodos GetPlayer / PlayerManager"
            grep -nE "GetPlayer[A-Za-z]*\(|PlayerManager|m_PlayerDict|m_PlayerMap|m_EntityList|m_Entitys" "$D" | head -40
            echo "### 4. contenedores de AttackableEntity"
            grep -nE "List<AttackableEntity>|Dictionary<[^>]*AttackableEntity" "$D" | head -20
            echo "### 5. AttackableEntity"
            sed -n '422760,422850p' "$D"
            echo "### 6. GINHBFJPFBP (m_AimAssist)"
            awk '/class GINHBFJPFBP /{f=1;c=0} f&&c<80{print;c++}' "$D"
            echo "### 7. EAimAssist"
            awk '/class EAimAssist /{f=1;c=0} f&&c<80{print;c++}' "$D"
            echo "### 8. HasHeuristicTarget / GetHeuristicTarget"
            sed -n '471055,471080p' "$D"
            sed -n '473455,473485p' "$D"
            echo "### 9. vida y estado"
            grep -nE "m_HP|GetHP|get_HP|IsDead|get_IsDead|IsAlive" "$D" | head -30
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: dump/
