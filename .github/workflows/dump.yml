name: dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: bajar binario
        run: |
          curl -L -o bin.zip "https://github.com/Papipro8080/samel-aim/releases/download/v1/freefireth.zip"
          unzip -o bin.zip
          ls -la
          ls -la global-metadata.dat
      - name: comprobar cifrado
        run: otool -l freefireth | grep -A4 LC_ENCRYPTION_INFO || echo "SIN SEGMENTO DE CIFRADO"
      - name: dumper
        run: |
          curl -L -o i2c.zip https://github.com/Perfare/Il2CppDumper/releases/latest/download/Il2CppDumper-net8.zip
          unzip -o i2c.zip -d i2c
          dotnet i2c/Il2CppDumper.dll freefireth global-metadata.dat dump
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: dump/
