name: dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: bajar binario
        run: |
          curl -fL -o freefireth "https://github.com/Papipro8080/samel-aim/releases/download/v1/freefireth"
      - name: dumper
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          curl -fL -o i2c.zip "https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net7-v6.7.46.zip"
          unzip -o i2c.zip -d i2c
          cd i2c
          set +e
          CMD="dotnet Il2CppDumper.dll $GITHUB_WORKSPACE/freefireth $GITHUB_WORKSPACE/global-metadata.dat $GITHUB_WORKSPACE/dump"
          printf '\n\n\n\n' | timeout 300 script -qec "$CMD" /dev/null > out.txt 2>&1
          cd "$GITHUB_WORKSPACE"
          SRC=$(find "$GITHUB_WORKSPACE" -name dump.cs | head -1)
          mkdir -p "$GITHUB_WORKSPACE/dump"
          if [ -n "$SRC" ]; then cp "$SRC" "$GITHUB_WORKSPACE/dump/dump.cs"; fi
          D="$GITHUB_WORKSPACE/dump/dump.cs"
          {
            echo "### 0. localizado"
            echo "$SRC"
            ls -la "$D"
            echo "### A. m_Players"
            grep -n "m_Players" "$D" | head -20
            echo "### B. m_LocalPlayer"
            grep -n "m_LocalPlayer" "$D" | head -20
            echo "### C. SetTargetHeuristic"
            grep -n "SetTargetHeuristic" "$D" | head -10
            echo "### D. AttackableEntity y descendientes"
            grep -nE "class [A-Za-z0-9_]+ : AttackableEntity" "$D" | head -30
            echo "### E. clases Player / COW"
            grep -nE "class (COW|Player)[A-Za-z0-9_]* " "$D" | grep -vE "PlayerPrefs|PlayerConnection|PlayerLoop|PlayerEditor|PlayerAnim|PlayerAudio|PlayerName" | head -40
            echo "### F. region del juego 4100-4999"
            grep -nE "class [A-Za-z0-9_.]+ .*TypeDefIndex: 4[1-9][0-9]{2}" "$D" | head -120
            echo "### G. aim / aim assist"
            grep -niE "class [A-Za-z0-9_]*[Aa]im[A-Za-z0-9_]* " "$D" | head -30
            echo "### H. huesos y camara"
            grep -n "GetBoneTransform\|WorldToScreenPoint" "$D" | head -20
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: dump/
