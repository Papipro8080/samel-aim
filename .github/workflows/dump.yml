name: dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: bajar binario
        run: |
          curl -fL -o freefireth "https://github.com/Papipro8080/samel-aim/releases/download/v1/freefireth"
          ls -la freefireth global-metadata.dat
      - name: dumper
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          curl -fL -o i2c.zip "https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net7-v6.7.46.zip"
          unzip -o i2c.zip -d i2c
          cd i2c
          set +e
          CMD="dotnet Il2CppDumper.dll $GITHUB_WORKSPACE/freefireth $GITHUB_WORKSPACE/global-metadata.dat $GITHUB_WORKSPACE/dump"
          printf '\n\n\n\n' | timeout 300 script -qec "$CMD" /dev/null > out.txt 2>&1
          CODE=$?
          SRC=$(find "$GITHUB_WORKSPACE" -name dump.cs | head -1)
          if [ -n "$SRC" ]; then
            mkdir -p "$GITHUB_WORKSPACE/dump"
            cp -r "$(dirname "$SRC")"/. "$GITHUB_WORKSPACE/dump/"
          fi
          {
            echo "### dumper"
            echo "EXIT=$CODE"
            head -20 out.txt
            echo "--- localizado ---"
            echo "$SRC"
            echo "--- clases de interes ---"
            grep -nE "class (Player|Match|Aim|CameraController|TargetHeuristic|Avatar|Weapon|Bone)[A-Za-z]*" "$GITHUB_WORKSPACE/dump/dump.cs" | head -80
            echo "--- tamano ---"
            ls -la "$GITHUB_WORKSPACE/dump" | head -20
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: dump/
