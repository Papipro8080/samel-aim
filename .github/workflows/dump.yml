name: dump
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: bajar binario
        run: curl -fL -o freefireth "https://github.com/Papipro8080/samel-aim/releases/download/v1/freefireth"
      - name: dumper
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          curl -fL -o i2c.zip "https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net7-v6.7.46.zip"
          unzip -o i2c.zip -d i2c
          cd i2c
          set +e
          CMD="dotnet Il2CppDumper.dll $GITHUB_WORKSPACE/freefireth $GITHUB_WORKSPACE/global-metadata.dat $GITHUB_WORKSPACE/dump"
          printf '\n\n\n\n' | timeout 300 script -qec "$CMD" /dev/null > out.txt 2>&1
          cd "$GITHUB_WORKSPACE"
          mkdir -p dump
          cp "$(find "$GITHUB_WORKSPACE" -name dump.cs | head -1)" dump/dump.cs
          D="$GITHUB_WORKSPACE/dump/dump.cs"
          {
            echo "### 1. clase que declara m_LocalPlayer"
            awk 'NR>=467000 && NR<=468176 && /class /' "$D" | tail -3
            echo "### 2. contexto de m_LocalPlayer"
            sed -n '468140,468200p' "$D"
            echo "### 3. listas de Player"
            grep -nE "List<Player>|List<.*Player|Dictionary<[^>]*Player|Player\[\]" "$D" | head -30
            echo "### 4. variantes de lista de jugadores"
            grep -niE "m_players|m_allplayers|m_playerlist|m_playermap|m_playerdict|m_playerarray" "$D" | head -20
            echo "### 5. cabecera de Player"
            sed -n '471252,471400p' "$D"
            echo "### 6. PlayerNetwork"
            sed -n '479347,479430p' "$D"
            echo "### 7. CameraControllerBase y Manager"
            sed -n '423018,423230p' "$D"
            echo "### 8. Heuristic"
            grep -n "Heuristic" "$D" | head -20
            echo "### 9. clases con Aim"
            grep -nE "class [A-Za-z0-9_]*Aim[A-Za-z0-9_]*" "$D" | head -30
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: dump/
